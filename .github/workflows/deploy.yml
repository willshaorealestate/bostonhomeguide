name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # market-update.yml and blog-post.yml push to main using the default
  # GITHUB_TOKEN, and GitHub deliberately does not let GITHUB_TOKEN pushes
  # trigger other workflows (anti-loop protection) - so their commits never
  # reached this `push` trigger. Picking them up here via workflow_run instead.
  workflow_run:
    workflows: ["Update Market Data (MLSPIN)", "Publish Next Blog Post"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_FUB_API_KEY: ${{ secrets.VITE_FUB_API_KEY }}
        run: pnpm exec vite build

      - name: Copy CNAME to build output
        run: cp CNAME dist/public/CNAME

      - name: Copy 404 for SPA routing
        # Must run before prerendering, which replaces index.html with the rendered homepage.
        run: cp dist/public/index.html dist/public/404.html

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Prerender pages
        run: node scripts/prerender.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
