name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # market-update.yml, blog-post.yml and town-trends.yml push to main using the default
  # GITHUB_TOKEN, and GitHub deliberately does not let GITHUB_TOKEN pushes
  # trigger other workflows (anti-loop protection) - so their commits never
  # reached this `push` trigger. Picking them up here via workflow_run instead.
  workflow_run:
    workflows: ["Update Market Data (MLSPIN)", "Publish Next Blog Post", "Update Town Trends (MLSPIN)"]
    types: [completed]
    # Only runs on main reach the live site (a test run on a preview branch shouldn't redeploy)
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For workflow_run, build the latest main: the data workflow's head_sha is the commit it
          # started from, not the commit it just pushed, so using it deployed one update behind.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec vite build

      - name: Copy CNAME to build output
        run: cp CNAME dist/public/CNAME

      - name: Copy 404 for SPA routing
        # Must run before prerendering, which replaces index.html with the rendered homepage.
        run: cp dist/public/index.html dist/public/404.html

      - name: Install Playwright Chromium
        # GitHub's Ubuntu runners already have Chromium's system libraries, so don't use
        # --with-deps: it pulls ~a dozen font packages from archive/security.ubuntu.com on every
        # deploy, and when those servers are unreachable the whole deploy fails (Nov 11, 2026).
        # Prerendering only saves HTML, so the extra fonts aren't needed. Only if Chromium can't
        # start do we install the system packages, with retries.
        run: |
          for i in 1 2 3; do pnpm exec playwright install chromium && break; echo "Chromium download failed, retrying in 20s"; sleep 20; done
          if node -e "require('playwright').chromium.launch().then(b => b.close())"; then
            echo "Chromium starts without extra system packages"
          else
            for i in 1 2 3; do pnpm exec playwright install-deps chromium && break; echo "System package install failed, retrying in 30s"; sleep 30; done
            node -e "require('playwright').chromium.launch().then(b => b.close())"
          fi

      - name: Prerender pages
        run: node scripts/prerender.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
